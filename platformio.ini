; PlatformIO Project Configuration File
;
; P1P2-ESP8266-PARKED
; Minimal placeholder firmware that disables Arnold/P1P2Monitor on the
; ESP8266 so its UART pins (GPIO1/GPIO3, wired to the ATmega) stay free
; for the ESP32 to use instead.
;
; NOTE: adjust `board` below to match your actual ESP8266 module if it
; differs. The original P1P2-ESP-interface board uses an ESP-12F module,
; which is compatible with the generic "esp12e" board definition used
; here. If your existing Arnold platformio.ini / Arduino IDE board
; selection used something else (flash size, "esp8266_generic", etc.),
; match that instead so flash layout stays consistent with what's
; already on the device.

[env:esp8266_parked]
platform = espressif8266
board = esp12e
framework = arduino

; Uncomment and adjust if your original board used a different flash
; layout (check your existing Arnold platformio.ini / Arduino IDE
; "Flash Size" setting for this board):
; board_build.flash_mode = dout
; board_build.ldscript = eagle.flash.4m1m.ld

monitor_speed = 115200

build_flags =
    -DNDEBUG
